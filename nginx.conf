map $http_accept $want_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # HTML: always revalidate so script and stylesheet updates are instant
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 0;
    }

    # Do not cache Service Worker
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 0;
    }

    # JS and CSS: revalidate to ensure code fixes propagate immediately
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 0;
    }

    # JSON data: revalidate so updates are immediate
    location ~* \.json$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 0;
    }

    # Media and icons: safe to cache
    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }


    # Agent discovery documents
    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ^~ /.well-known/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /llms.txt {
        types { text/markdown txt; }
        default_type text/markdown;
    }

    location = /auth.md {
        default_type text/markdown;
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = / {
        if ($want_markdown) { rewrite ^ /llms.txt last; }
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    add_header Link '</.well-known/api-catalog>; rel="api-catalog", </auth.md>; rel="describedby"; type="text/markdown", </.well-known/agent-card.json>; rel="a2a-agent-card", </.well-known/ai-catalog.json>; rel="ai-catalog"' always;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
    add_header Link '</.well-known/api-catalog>; rel="api-catalog", </auth.md>; rel="describedby"; type="text/markdown", </.well-known/agent-card.json>; rel="a2a-agent-card", </.well-known/ai-catalog.json>; rel="ai-catalog"' always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
