<body>
  <header class="navbar">
    <div class="navbar-container">
      <a class="navbar-brand" href="index.html">🦕 Webisaurus</a>
      <nav class="navbar-nav">
        <a href="index.html" class="nav-link active">Explorer</a>
        <a href="compare.html" class="nav-link">Compare</a>
      </nav>
      <div class="navbar-actions">
        <button id="palette-trigger" class="palette-trigger-btn" aria-label="Open command palette">
          <span>🔍</span>
          <span>Search...</span>
          <kbd class="palette-kbd">Ctrl K</kbd>
        </button>
        <button id="theme-toggle" class="btn-icon" aria-label="Toggle theme">
          <span class="theme-icon">☀️</span>
        </button>
      </div>
    </div>
  </header>
  
  <main class="main-content">
    <div class="explorer-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title-row">
            <h2>Languages</h2>
            <span class="language-count" id="language-count">140</span>
          </div>
          <div class="sidebar-search-box">
            <input type="text" id="sidebar-search" class="sidebar-search-input" placeholder="Filter languages..." aria-label="Filter languages">
          </div>
          <div class="filter-chips" id="filter-chips">
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="Systems">Systems</button>
            <button class="filter-chip" data-filter="Web & Scripting">Web</button>
            <button class="filter-chip" data-filter="Enterprise">Enterprise</button>
            <button class="filter-chip" data-filter="Functional">Functional</button>
            <button class="filter-chip" data-filter="Data Science">Data</button>
            <button class="filter-chip" data-filter="Compiled">Compiled</button>
            <button class="filter-chip" data-filter="Dynamic">Dynamic</button>
            <button class="filter-chip" data-filter="Static">Static</button>
          </div>
        </div>
        <div class="language-list" id="language-list">
          <!-- JS populates -->
        </div>
      </aside>
      <section class="content-area" id="content-area">
        <div class="content-header">
          <div class="header-main-row">
            <div class="header-title-group">
              <h1 id="current-language-name">Select a Language</h1>
              <div class="language-meta" id="language-meta">
                <!-- badges for version, paradigm, and playground -->
              </div>
            </div>
            <div class="header-actions">
              <button id="share-view-btn" class="action-btn" title="Copy shareable link to this language">🔗 Share</button>
            </div>
          </div>
        </div>
        <div class="concepts-grid" id="concepts-grid">
          <!-- JS populates concept cards -->
        </div>
      </section>
    </div>
  </main>
  
  <footer class="footer">
    <p>Webisaurus — Polyglot Syntax Reference</p>
  </footer>
  
  <!-- Ad Banner -->
  <div class="site-ad-container" style="text-align:center;margin:20px auto;max-width:100%;overflow:hidden;">
